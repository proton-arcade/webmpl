<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixt Web OS — development build</title>
    <meta name="theme-color" content="#2b2b2b" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />

    <!--
      The development entry point. It loads the TypeScript sources, so it needs
      the Vite dev server (`npm run dev`, which opens this page). It is not part
      of the published site: index.html is, and it loads the prebuilt bundle so
      it works on any static host.

      It is also the administrator's build page, so it asks the backend who is
      signed in before it loads anything. An administrator gets the live source
      build; anybody else — a standard account, a guest, or nobody at all — is
      sent to the published site instead. The application script is only
      injected once that answer comes back, so a non-administrator never
      downloads or runs the development bundle.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>Mixt Web OS needs JavaScript to boot.</noscript>
    <script>
      /* Runs before anything else on the page. */
      ;(function () {
        var toPublished = function (reason) {
          var note = document.getElementById('gate-note')
          if (note) note.textContent = reason
          setTimeout(function () { location.replace('index.html') }, 900)
        }

        var note = document.createElement('p')
        note.id = 'gate-note'
        note.textContent = 'Checking who is signed in…'
        note.style.cssText =
          'font:13px system-ui,sans-serif;color:#666;text-align:center;margin-top:38vh'
        document.body.appendChild(note)

        fetch('api/session', { credentials: 'same-origin' })
          .then(function (r) { return r.ok ? r.json() : null })
          .then(function (s) {
            if (s && s.role === 'admin') {
              note.textContent = 'Administrator — loading the development build…'
              var script = document.createElement('script')
              script.type = 'module'
              script.src = '/src/main.tsx'
              document.body.appendChild(script)
            } else {
              toPublished(
                s && s.username
                  ? 'The development build is only for the administrator. Taking you to the desktop…'
                  : 'Sign in as the administrator to use the development build. Taking you to the desktop…'
              )
            }
          })
          .catch(function () {
            /* No backend answering: there is no session to trust. */
            toPublished('The development build needs the backend running. Taking you to the desktop…')
          })
      })()
    </script>
  </body>
</html>
